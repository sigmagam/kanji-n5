name: CI & Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    name: Install · TypeCheck · Lint · Test · Validate
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --ci

      - name: Validate dataset
        run: npm run validate:dataset

      - name: Validate Expo project
        run: npm run validate:project

  android-build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    needs: quality
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set Android SDK env
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm install

      - name: Generate Android native project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: Configure signing
        run: |
          # Ensure release build uses debug keystore so it produces an installable signed APK
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle || true

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" || ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m"
          cd ..

      - name: Collect APK
        run: |
          mkdir -p output-apk
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} output-apk/ \;
          ls -lh output-apk/
          if [ -f output-apk/app-release.apk ]; then
            cp output-apk/app-release.apk ./kanji-n5-v1.0.0.apk
          elif [ -f output-apk/app-debug.apk ]; then
            cp output-apk/app-debug.apk ./kanji-n5-v1.0.0.apk
          else
            first_apk=$(find output-apk -name "*.apk" | head -n 1)
            cp "$first_apk" ./kanji-n5-v1.0.0.apk
          fi
          ls -lh ./kanji-n5-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kanji-n5-v1.0.0-apk
          path: |
            output-apk/*.apk
            ./kanji-n5-v1.0.0.apk
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 ./kanji-n5-v1.0.0.apk --clobber
          else
            gh release create v1.0.0 ./kanji-n5-v1.0.0.apk \
              --title "KANJI N5 — v1.0.0 APK (Android)" \
              --notes "### KANJI N5 — Japanese Flashcards v1.0.0 🎌

          Aplikasi Android offline-first untuk belajar kanji level N5 dengan arti Bahasa Indonesia.

          - 🎴 Flashcards interaktif
          - ✍️ Urutan goresan kanji (stroke order)
          - 🧠 Kuis 4 mode
          - ⭐ Favorit & Pelacakan progres belajar
          - ⚡ 100% Offline, tanpa backend server VPS

          **Cara Pasang:**
          Download file \`kanji-n5-v1.0.0.apk\` di bawah, buka di HP Android Anda dan pasang (izinkan Install Unknown Apps jika diminta)."
          fi
