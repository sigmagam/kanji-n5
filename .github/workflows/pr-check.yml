name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Dataset & Project Validation
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run validate:dataset
      - run: npm run validate:project
      - run: npm run typecheck
